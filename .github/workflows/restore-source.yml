name: Restore uploaded project files to repository root

on:
  push:
    paths:
      - ".github/workflows/restore-source.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild, verify, and extract the supplied ZIP
        run: |
          python - <<'PY'
          import base64
          import shutil
          import subprocess
          import zipfile
          from io import BytesIO
          from pathlib import Path, PurePosixPath

          parts = [
              "001", "002", "003", "004", "005",
              "006a.001", "006a.002", "006a.003", "006b",
              "006c.001", "006c.002", "006c.003a", "006c.003b",
          ]
          base = Path("uploads")
          encoded = "".join(
              (base / f"QuotexPythonBot-updated.zip.b64.{part}").read_text(encoding="utf-8").strip()
              for part in parts
          )
          archive = base64.b64decode(encoded, validate=True)

          with zipfile.ZipFile(BytesIO(archive)) as zf:
              corrupt = zf.testzip()
              if corrupt:
                  raise RuntimeError(f"ZIP CRC check failed: {corrupt}")

              prefix = PurePosixPath("QuotexPythonBot-main")
              written = []
              for member in zf.infolist():
                  if member.is_dir():
                      continue
                  member_path = PurePosixPath(member.filename)
                  if not member_path.is_relative_to(prefix):
                      raise RuntimeError(f"Unexpected ZIP path: {member.filename}")
                  relative = member_path.relative_to(prefix)
                  if not relative.parts or any(part in ("", ".", "..") for part in relative.parts):
                      raise RuntimeError(f"Unsafe ZIP path: {member.filename}")
                  destination = Path(*relative.parts)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(zf.read(member))
                  written.append(destination.as_posix())

          if not written:
              raise RuntimeError("No project files found in the ZIP.")

          shutil.rmtree(base)
          workflow = Path(".github/workflows/restore-source.yml")
          workflow.unlink(missing_ok=True)
          try:
              workflow.parent.rmdir()
              workflow.parent.parent.rmdir()
          except OSError:
              pass

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "-A"], check=True)
          subprocess.run(["git", "commit", "-m", "Restore project source files to repository root"], check=True)
          subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)
          print(f"Restored {len(written)} files to repository root:")
          print("\n".join(written))
          PY
